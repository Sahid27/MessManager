name: mess_manager
description: Mess Management System
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^8.0.0
  dartz: ^0.10.1

  # Navigation
  go_router: ^14.2.0

  # Firebase
  firebase_core: ^3.3.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.2.0
  firebase_messaging: ^15.0.0

  # Local cache (offline)
  hive_flutter: ^1.1.0

  # Models
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  uuid: ^4.4.0

  # UI widgets
  table_calendar: ^3.1.2
  fl_chart: ^0.69.0
  flutter_slidable: ^3.1.1
  shimmer: ^3.0.0

  # Utilities
  intl: ^0.19.0
  rxdart: ^0.28.0
  flutter_local_notifications: ^17.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  build_runner: ^2.4.11
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true